---
name: "📕 Documentation Issue"
description: Report an issue in the API Reference documentation or Developer Guide
title: "(short issue description)"
labels: [documentation, needs-triage, bug]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Links
      description: |
        Include links to affected documentation page(s).
    validations:
      required: true

  - type: checkboxes
    id: ai-tools
    attributes:
      label: AI tools
      description: See the "Automated Tools" section of CONTRIBUTING.md.
      options:
        - label: I have reviewed this issue myself, including any content generated by AI tools
          required: false
